services:
  postgresql:
    container_name: postgresql
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: scrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29.2
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5432/scrapper
      - --username=postgres
      - --password=password
      - update
    volumes:
      - ./migrations:/changesets
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    networks:
      - backend
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    container_name: kafka
    restart: on-failure:5
    ports:
      - "19092:19092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,DOCKER://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9092", "1", "10"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:8.8.1-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend

  grafana:
    image: grafana/grafana-oss:12.0.2
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCRAPPER_BASE_URL=http://scrapper:8081
    ports:
      - "8080:8080"
      - "8090:8090"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    container_name: scrapper
    depends_on:
      liquibase-migrations:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SO_TOKEN_KEY=${SO_TOKEN_KEY}
      - SO_ACCESS_TOKEN=${SO_ACCESS_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/scrapper
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BOT_BASE_URL=http://bot:8080
    ports:
      - "8081:8081"
      - "8091:8091"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-datalog:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:
