name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: edu-self-hosted
    container:
      image: maven:3-eclipse-temurin-23
    timeout-minutes: 10
    name: Build
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: maven build
        run: mvn verify

      - id: jacoco
        uses: madrapps/jacoco-report@v1.7.1
        if: ( github.event_name != 'workflow_dispatch' )
        with:
          paths: ${{ github.workspace }}/report/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  linter:
    runs-on: edu-self-hosted
    container:
      image: maven:3-eclipse-temurin-23
    timeout-minutes: 10
    name: linter
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - run: mvn compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check

  docker:
    name: build Docker images
    runs-on: ubuntu-latest
    needs: [ build, linter ]
    steps:
      - uses: actions/checkout@v4

      - name: Build bot image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: bot/Dockerfile
          push: false
          tags: bot:ci

      - name: Build scrapper image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: scrapper/Dockerfile
          push: false
          tags: scrapper:ci
